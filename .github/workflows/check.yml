name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vale
        run: |
          mkdir -p bin
          curl -sfL https://github.com/errata-ai/vale/releases/download/v3.21.0/vale_3.21.0_Linux_64-bit.tar.gz | tar xz -C bin vale
      - run: bundle binstubs asciidoctor --path bin
      - run: make check

  build:
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python3 scripts/build-recommendations.py
      - run: make book web
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            build/*.pdf
            build/*.epub
            site/
